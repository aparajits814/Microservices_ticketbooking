server:
  port: 8081
spring:
  application:
     name: "movies"
  datasource:
    url: jdbc:mysql://localhost:3306/moviesdb
    username: root
    password: root
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
  data:
    redis:
      port: 6379
      host: localhost


management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka
